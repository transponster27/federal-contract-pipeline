services:
  phase1-assessment:
    build: .
    container_name: phase1-assessment
    command: ["python", "src/bronze_builder.py"]
    
    # Memory limits (CRITICAL)
    mem_limit: 4g           # Hard limit: 4GB RAM
    memswap_limit: 4g       # No swap (prevents slowdown)
    mem_reservation: 2g     # Soft limit: reserve 2GB
    
    # CPU limits
    cpus: 2                 # Use 2 CPU cores
    cpu_shares: 1024        # CPU priority
    
    # Volume mounts
    volumes:
      - ./data/raw:/app/data/raw:ro      # Read-only input
      - ./data/output:/app/data/output   # Read-write output
      - ./src:/app/src                   # Live code updates
    
    # Environment variables
    environment:
      - CHUNK_SIZE=100000
      - LOG_LEVEL=INFO
    
    # Restart policy
    restart: "no"
    
    # Resource monitoring
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'