services:
  phase1-assessment:
    build: .
    container_name: phase1-assessment
    command: ["python", "src/bronze_builder.py"]
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/bronze:/app/data/bronze
      - ./data/silver:/app/data/silver
      - ./data/quarantine:/app/data/quarantine
      - ./data/reports:/app/data/reports
      - ./src:/app/src
    environment:
      - CHUNK_SIZE=100000
      - LOG_LEVEL=INFO